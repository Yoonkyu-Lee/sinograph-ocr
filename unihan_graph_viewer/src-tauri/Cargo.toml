[package]
name = "unihan_graph_viewer"
version = "0.2.0"
description = "Sinograph Dictionary — desktop viewer over the canonical_v3 hanzi database"
authors = ["yoong"]
edition = "2021"

[lib]
name = "unihan_graph_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
